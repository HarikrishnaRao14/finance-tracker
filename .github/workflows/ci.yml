name: CI

# build:        unit + pipeline tests, lint, debug APK (every push / PR)
# ui-screens:   real Android emulator opens every screen and takes screenshots for review
# release:      only for commits on main marked [release], and only if both jobs passed.
#               Publishes the APK as the "latest" GitHub Release, which the app's
#               in-app updater and the fixed download link use:
#               https://github.com/HarikrishnaRao14/finance-tracker/releases/latest/download/arthix.apk
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug 2>&1 | tee build.log

      # Turns the important lines of a failed build into annotations, which can be read
      # through the GitHub API even when the full log download is not available.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |^w: .*(error|unresolved)|FAILED|What went wrong|AssertionError|Exception|expected:|Caused by|^> |ERROR:' build.log \
            | grep -v 'BUILD FAILED' | head -200 > errors.txt || true
          [ -s errors.txt ] || tail -80 build.log > errors.txt
          split -l 25 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=build log ${f#chunk_}::${msg}"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arthix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  ui-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # to publish screenshots to the ci-screenshots pre-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Open every screen on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-ui-tests.sh

      - name: Publish screenshots for review
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(shots/*.png shots/*.txt)
          [ ${#files[@]} -gt 0 ] || { echo "no screenshots"; exit 0; }
          gh release view ci-screenshots >/dev/null 2>&1 || \
            gh release create ci-screenshots --title "CI screenshots" --notes "Screens from the latest CI run" --prerelease --latest=false
          for a in $(gh release view ci-screenshots --json assets --jq '.assets[].name'); do
            gh release delete-asset ci-screenshots "$a" -y
          done
          gh release upload ci-screenshots "${files[@]}" --clobber

      - name: Fail if a screen test failed
        run: test ! -f shots/UI_TESTS_FAILED.txt

  release:
    needs: [build, ui-screens]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arthix-debug-${{ github.run_number }}
          path: apk

      - name: Prepare release files
        shell: bash
        env:
          NOTES: ${{ github.event.head_commit.message }}
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          cp apk/*.apk dist/arthix.apk
          # The app reads this file on every open to decide whether an update is available.
          jq -n --argjson code "$RUN" --arg name "0.2.$RUN" --arg notes "$NOTES" \
            --arg apk "https://github.com/$REPO/releases/latest/download/arthix.apk" \
            '{versionCode: $code, versionName: $name, notes: $notes, apk: $apk}' > dist/version.json
          cat dist/version.json

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Arthix 0.2.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            dist/arthix.apk
            dist/version.json
          make_latest: "true"
