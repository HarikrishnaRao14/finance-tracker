name: CI

# Every push and pull request: run unit tests, lint, and build a debug APK you can install.
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 30
    permissions:
      contents: write # needed to publish the release
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug 2>&1 | tee build.log

      # Turns the important lines of a failed build into annotations, which can be read
      # through the GitHub API even when the full log download is not available.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |^w: .*(error|unresolved)|FAILED|What went wrong|AssertionError|Exception|expected:|Caused by|^> |ERROR:' build.log \
            | grep -v 'BUILD FAILED' | head -200 > errors.txt || true
          [ -s errors.txt ] || tail -80 build.log > errors.txt
          split -l 25 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=build log ${f#chunk_}::${msg}"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arthix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Every green build on main becomes the "latest" GitHub Release, so this link always
      # gives the newest APK, with no zip and no login:
      # https://github.com/HarikrishnaRao14/finance-tracker/releases/latest/download/arthix.apk
      - name: Prepare release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          NOTES: ${{ github.event.head_commit.message }}
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/arthix.apk
          # The app reads this file on every open to decide whether an update is available.
          jq -n --argjson code "$RUN" --arg name "0.2.$RUN" --arg notes "$NOTES" \
            --arg apk "https://github.com/$REPO/releases/latest/download/arthix.apk" \
            '{versionCode: $code, versionName: $name, notes: $notes, apk: $apk}' > dist/version.json
          cat dist/version.json

      - name: Publish as latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Arthix 0.2.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            dist/arthix.apk
            dist/version.json
          make_latest: "true"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          retention-days: 14
